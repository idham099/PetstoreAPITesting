name: Petstore API Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Berikan izin agar workflow bisa menulis ke GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Newman & Reporter
      run: |
        npm install -g newman
        npm install -g newman-reporter-htmlextra

    - name: Run Postman Collection via Newman
      run: |
        newman run Petstore_Test.json -r cli,htmlextra

    # 1. Ubah nama file HTML agar mudah diakses (menjadi index.html)
    - name: Prepare HTML Report for Pages
      run: |
        mkdir -p public
        cp newman/*.html public/index.html

    # 2. Upload file ke GitHub Pages
    - name: Upload artifact for GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

  # Job tambahan untuk melakukan deployment
  deploy:
    needs: test-api
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
