name: Petstore API Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Memberikan izin akses untuk deployment ke GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Newman & Reporter
      run: |
        npm install -g newman
        npm install -g newman-reporter-htmlextra

    # Menentukan lokasi dan nama file HTML secara langsung agar tidak perlu 'cp'
    - name: Run Postman Collection via Newman
      run: |
        mkdir -p public
        newman run Petstore_Test.json -r cli,htmlextra --reporter-htmlextra-export public/index.html

    - name: Upload artifact for GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

  deploy:
    needs: test-api
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
